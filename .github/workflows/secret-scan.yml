name: Secret scan

on:
  push:
    branches: [main, master, develop, testing, feature/vue-migration]
  pull_request:
    branches: [main, master, develop, testing]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
