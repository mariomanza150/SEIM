# CI: single entry point (lint, security, typecheck, backend, frontends, docker scan, perf on PR).
# CD: see deploy.yml (GHCR + environments). Playwright E2E: e2e-tests.yml. Selenium is deprecated (manual-only workflow).
# Postgres/Redis (CI): DB seim_test, user seimuser, password seimpass — keep in sync across jobs.

name: CI

on:
  push:
    branches: [main, master, develop, feature/vue-migration]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: seim.settings.test
  DJANGO_ENV: test
  DEBUG: "false"
  SECRET_KEY: ci-not-a-secret-key-for-tests-only

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check and format
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Dependency manifest
        run: python scripts/check_python_deps.py

      - name: Job summary
        if: always()
        run: |
          echo "## Lint" >> "$GITHUB_STEP_SUMMARY"
          echo "Ruff check + format complete." >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r requirements.txt

      - name: Bandit (report artifact)
        run: bandit -c pyproject.toml -r . -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Bandit (enforcing)
        run: bandit -c pyproject.toml -r . -ll

      - name: pip-audit
        run: pip-audit -r requirements.txt --desc on

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  typecheck:
    name: Typecheck (mypy, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: mypy
        run: mypy . --ignore-missing-imports

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: seim_test
          POSTGRES_USER: seimuser
          POSTGRES_PASSWORD: seimpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Install gettext (msgfmt for compilemessages)
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Migrate
        env:
          DATABASE_URL: postgresql://seimuser:seimpass@localhost:5432/seim_test
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate --noinput

      - name: Compile translation messages
        run: python manage.py compilemessages -l de -l es -l fr

      - name: Pytest (unit + integration)
        env:
          DATABASE_URL: postgresql://seimuser:seimpass@localhost:5432/seim_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest \
            --cov=accounts --cov=analytics --cov=api --cov=application_forms --cov=core \
            --cov=data_management --cov=documents --cov=exchange \
            --cov=grades --cov=internacional --cov=notifications \
            --cov=seim \
            --cov-config=pyproject.toml \
            --cov-report=xml --cov-report=html --cov-fail-under=80 \
            --junitxml=test-results.xml \
            tests/unit/ tests/integration/ \
            -v --tb=short

      - name: Upload coverage to Codecov
        id: codecov_backend
        if: always()
        continue-on-error: ${{ secrets.CODECOV_TOKEN == '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          verbose: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-xml
          path: coverage.xml
          retention-days: 14

      - name: Upload JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results.xml
          retention-days: 14

      - name: Job summary
        if: always()
        env:
          HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
        run: |
          {
            echo "## Backend tests"
            echo "JUnit: artifact **backend-test-results**. Coverage XML: **backend-coverage-xml**."
            echo "Hard gate: pytest \`--cov-fail-under=80\` (unchanged)."
            if [ "$HAS_CODECOV_TOKEN" != "true" ]; then
              echo ""
              echo "**Codecov:** \`CODECOV_TOKEN\` is not set (forks / local act). Tokenless upload was attempted and does not fail this job."
              echo "On \`mariomanza150/SEIM\`, add the secret so upload failures fail CI — see [.github/README.md](.github/README.md)."
            elif [ "${{ steps.codecov_backend.outcome }}" != "success" ]; then
              echo ""
              echo "**Codecov:** upload failed. This job fails when \`CODECOV_TOKEN\` is set."
            else
              echo "**Codecov:** backend flag uploaded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-vue:
    name: Frontend (Vue / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - run: npm ci

      - name: Vitest (with coverage)
        run: npm run test:coverage

      - name: Vite build
        run: npm run build

      - name: Verify production dist
        run: test -f dist/index.html && test -d dist/assets

      - name: Upload coverage to Codecov
        id: codecov_frontend
        if: always()
        continue-on-error: ${{ secrets.CODECOV_TOKEN == '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend-vue/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          verbose: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-lcov
          path: frontend-vue/coverage/lcov.info
          retention-days: 14

      - name: Job summary
        if: always()
        env:
          HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
        run: |
          {
            echo "## Vue frontend"
            echo "Vitest + coverage + production build complete. Coverage LCOV: **frontend-coverage-lcov**."
            if [ "$HAS_CODECOV_TOKEN" != "true" ]; then
              echo ""
              echo "**Codecov:** \`CODECOV_TOKEN\` is not set (forks / local act). Tokenless upload was attempted and does not fail this job."
              echo "On \`mariomanza150/SEIM\`, add the secret so upload failures fail CI — see [.github/README.md](.github/README.md)."
            elif [ "${{ steps.codecov_frontend.outcome }}" != "success" ]; then
              echo ""
              echo "**Codecov:** upload failed. This job fails when \`CODECOV_TOKEN\` is set."
            else
              echo "**Codecov:** frontend flag uploaded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  docker-security:
    name: Docker image + Trivy
    runs-on: ubuntu-latest
    needs: [lint, security, backend-tests, frontend-vue]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image (Vue dist + collectstatic)
        run: docker build -t seim:ci .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: seim:ci
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  performance-tests:
    name: Performance (Locust, PR only)
    runs-on: ubuntu-latest
    needs: [backend-tests]
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: seim_test
          POSTGRES_USER: seimuser
          POSTGRES_PASSWORD: seimpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install locust

      - name: Migrate and seed
        env:
          DATABASE_URL: postgresql://seimuser:seimpass@localhost:5432/seim_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py migrate --noinput
          python manage.py create_initial_data

      - name: Start server
        env:
          DATABASE_URL: postgresql://seimuser:seimpass@localhost:5432/seim_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          sleep 10

      - name: Locust
        run: |
          locust -f tests/performance/locustfile.py \
            --host=http://localhost:8000 \
            --users=10 --spawn-rate=2 --run-time=30s \
            --headless --html=performance-report.html

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: performance-report.html
          retention-days: 14
