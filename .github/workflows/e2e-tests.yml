name: E2E Tests (Playwright)

on:
  push:
    branches: [main, develop, master, feature/vue-migration]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

concurrency:
  group: e2e-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  DJANGO_SETTINGS_MODULE: seim.settings.test
  DEBUG: "false"
  SECRET_KEY: ci-not-a-secret-key-for-tests-only
  RUN_SEED_VUE_E2E: "1"

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: seim_e2e
          POSTGRES_USER: seimuser
          POSTGRES_PASSWORD: seimpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-test.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Build Vue SPA
        run: |
          npm --prefix frontend-vue ci
          npm --prefix frontend-vue run build

      - name: Install Playwright browsers
        run: |
          # Ubuntu 24.04 (noble) renamed libasound2 → libasound2t64; playwright --with-deps
          # still requests the old package name and fails apt. Install deps manually.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0t64 \
            libnspr4 \
            libnss3 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            xvfb
          playwright install chromium

      - name: Create .env file
        run: |
          # Overwrite Compose hostname ``db`` from env.example; django-environ keeps the first value.
          cp env.example .env
          sed -i 's#@db:5432/seim#@localhost:5432/seim_e2e#g' .env
          sed -i 's#redis://redis:6379#redis://localhost:6379#g' .env
          echo "DEBUG=false" >> .env
          echo "DJANGO_SETTINGS_MODULE=seim.settings.test" >> .env
          echo "CELERY_BROKER_URL=redis://localhost:6379/0" >> .env
          echo "CELERY_RESULT_BACKEND=redis://localhost:6379/0" >> .env

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Create test data
        run: |
          python manage.py seed_demo_readiness

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Start Django server
        env:
          DJANGO_SETTINGS_MODULE: seim.settings.test
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          sleep 5

      - name: Wait for server
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/ > /dev/null 2>&1; do sleep 2; done'

      - name: Run E2E tests
        run: |
          # pytest-playwright: omit --headed for headless ( --headed=false is invalid ).
          # Skip video_demo (manual recording suite) in CI.
          pytest tests/e2e_playwright/ \
            --base-url=http://localhost:8000 \
            --browser=chromium \
            -n auto \
            -m "not video_demo" \
            --maxfail=5 \
            --html=tests/e2e_playwright/reports/report.html \
            --self-contained-html \
            -v
        env:
          HEADLESS: "true"
          BASE_URL: http://localhost:8000
          API_URL: http://localhost:8000
          VITE_API_BASE_URL: http://localhost:8000

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e_playwright/screenshots/
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: tests/e2e_playwright/reports/
          retention-days: 14

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos
          path: tests/e2e_playwright/videos/
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'tests/e2e_playwright/reports/report.html';

            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              const match = report.match(/(\d+) passed/);
              const passed = match ? match[1] : '0';

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## E2E Test Results\n\n${passed} tests passed\n\nFull report available in workflow artifacts.`
              });
            }
