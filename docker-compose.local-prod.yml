# Dedicated project name so this file does not share the default ``seim`` project with
# docker-compose.yml (avoids orphan warnings and accidental mixing with dev/test profiles).
name: seim-localprod

services:
  db:
    image: postgres:15-alpine
    container_name: seim-db-local-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: seim_prod
      POSTGRES_USER: seimuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - seim-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seimuser -d seim_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: seim-redis-local-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_prod_data:/data
    networks:
      - seim-prod-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: seim-web-local-prod
    env_file:
      - .env.local-prod
    restart: unless-stopped
    # See scripts/local-prod-web-entry.sh — waits for Compose DNS + Postgres TCP before migrate.
    command: ["bash", "/app/scripts/local-prod-web-entry.sh"]
    # Published ports avoid clashing with dev compose (``web`` uses host 8001). Use 8020/8021 for local-prod.
    ports:
      - "8020:8000"
      - "8021:8000"
    volumes:
      - static_prod_volume:/app/staticfiles
      - media_prod_volume:/app/media
    networks:
      - seim-prod-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=seim.settings.production
      - DJANGO_ENV=production
      - DEBUG=False
      - DISABLE_PAGE_CACHE_MIDDLEWARE=1
      # Playwright against :8020 issues hundreds of JWT/profile calls; keep prod-like
      # throttles off for this local stack (also gated in production.py via ALLOW_ANY_HOST).
      - DISABLE_THROTTLE_E2E=1
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-me-in-real-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,host.docker.internal,.ts.net}
      - ALLOW_ANY_HOST=${ALLOW_ANY_HOST:-1}
      - DATABASE_URL=postgresql://seimuser:${DB_PASSWORD:-changeme123}@db:5432/seim_prod
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - SECURE_SSL_REDIRECT=False
      - SESSION_COOKIE_SECURE=False
      - CSRF_COOKIE_SECURE=False
      - SECURE_HSTS_SECONDS=0
      # TLS terminators (Cloudflare Tunnel / Tailscale Serve) proxy HTTP to this container.
      # Backend is plain HTTP: ``http://127.0.0.1:8020`` — not https://.
      - USE_TLS_PROXY_HEADERS=1
      - USE_REQUEST_HOST_FOR_SITE=1
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8020,http://127.0.0.1:8020,http://localhost:8021,http://127.0.0.1:8021,http://host.docker.internal:8020,https://desktop-kg5i7pt.tail4dc6e5.ts.net}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8020,http://127.0.0.1:8020,http://localhost:8021,http://127.0.0.1:8021,http://host.docker.internal:8020,https://desktop-kg5i7pt.tail4dc6e5.ts.net,https://*.trycloudflare.com,https://*.cfargotunnel.com}
      - TOEFL_API_BASE_URL=${TOEFL_API_BASE_URL:-http://toefl:5000}
      - TOEFL_API_KEY=${TOEFL_API_KEY:-toefl-api-key-change-me}
      - TOEFL_SIGNING_SECRET=${TOEFL_SIGNING_SECRET:-toefl-signing-secret-change-me}
      - TOEFL_PUBLIC_BASE_URL=${TOEFL_PUBLIC_BASE_URL:-http://localhost:5020}
      - TOEFL_CALLBACK_URL=${TOEFL_CALLBACK_URL:-http://web:8000/api/toefl/webhook/}
      - TOEFL_RETURN_URL=${TOEFL_RETURN_URL:-http://localhost:8020/seim/toefl-practice}
      - TOEFL_DEFAULT_EXAM_CODE=${TOEFL_DEFAULT_EXAM_CODE:-director_extracted}

  celery:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: seim-celery-local-prod
    env_file:
      - .env.local-prod
    restart: unless-stopped
    command: celery -A seim worker --loglevel=info --concurrency=2
    volumes:
      - media_prod_volume:/app/media
    networks:
      - seim-prod-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery inspect ping -d celery@$$HOSTNAME"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - DJANGO_SETTINGS_MODULE=seim.settings.production
      - DJANGO_ENV=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-me-in-real-production}
      - DATABASE_URL=postgresql://seimuser:${DB_PASSWORD:-changeme123}@db:5432/seim_prod
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: seim-celery-beat-local-prod
    env_file:
      - .env.local-prod
    restart: unless-stopped
    command: celery -A seim beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - seim-prod-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery status > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    environment:
      - DJANGO_SETTINGS_MODULE=seim.settings.production
      - DJANGO_ENV=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-me-in-real-production}
      - DATABASE_URL=postgresql://seimuser:${DB_PASSWORD:-changeme123}@db:5432/seim_prod
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0


  toefl:
    build:
      context: ${TOEFL_CONTEXT:-../GitHub/TOEFL PRACTICE/TOEFL-Practice}
      dockerfile: Dockerfile
    container_name: seim-toefl-local-prod
    restart: unless-stopped
    ports:
      - "5020:5000"
    volumes:
      - toefl_sessions_prod:/app/data/sessions
    networks:
      - seim-prod-network
    environment:
      - SECRET_KEY=${TOEFL_SECRET_KEY:-toefl-secret-key-change-me}
      - API_KEY=${TOEFL_API_KEY:-toefl-api-key-change-me}
      - API_SIGNING_SECRET=${TOEFL_SIGNING_SECRET:-toefl-signing-secret-change-me}
      - ADMIN_PASSWORD=${TOEFL_ADMIN_PASSWORD:-admin}
      - PUBLIC_BASE_URL=${TOEFL_PUBLIC_BASE_URL:-http://localhost:5020}
      - APPLICATION_ROOT=${TOEFL_APPLICATION_ROOT:-}

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  static_prod_volume:
    driver: local
  media_prod_volume:
    driver: local
  toefl_sessions_prod:
    driver: local

networks:
  seim-prod-network:
    driver: bridge