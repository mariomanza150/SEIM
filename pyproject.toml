[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seim"
version = "1.0.0"
description = "Student Exchange Information Management System"
authors = [{name = "Mario Alejandro Manzano and SEIM contributors"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
# Runtime pins live in requirements.txt (Docker, CI, Makefile). Do not list a
# second dependency set here — it previously drifted (Django 5.2 vs 5.1).
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/mariomanza150/SEIM"
Issues = "https://github.com/mariomanza150/SEIM/issues"
Documentation = "https://github.com/mariomanza150/SEIM/blob/main/documentation/README.md"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pylint>=3.0.3",
    "bandit>=1.7.5",
    "pre-commit>=3.6.0",
    "pytest>=7.4.0",
    "pytest-django>=4.7.0",
    "coverage>=7.3.2",
]

test = [
    "pytest>=7.4.0",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "factory-boy>=3.3.0",
    "faker>=20.1.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["seim*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# Ruff configuration - used for linting and formatting (not Black)
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "migrations",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "B008",  # do not perform function calls in argument defaults (common in Django)
    "C901",  # too complex
    "DJ001", # avoid using null=True on string-based fields (sometimes needed)
    "B904",  # raise without from inside except (noisy legacy)
    "E722",  # bare except (noisy legacy)
    "B017",  # assert Raises(Exception) (noisy in tests/legacy)
    "DJ007", # ModelForm without Meta.fields/exclude
    "DJ008", # Model without __str__
    "DJ012", # order of model methods
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"*/tests/*" = ["B011"]    # assert False
"seim/settings/*.py" = ["F403", "F405", "E402"]
"seim/asgi.py" = ["E402"]
"scripts/**/*.py" = ["E402", "F401", "F405", "F403"]
"tests/**/*.py" = ["E402", "F401", "F811", "B018", "F405", "F403"]
"documentation/**/*.py" = ["E402", "F401"]
"core/management/commands/*.py" = ["E402", "F401"]
"core/permissions.py" = ["E402"]
"documents/services.py" = ["E402"]
"exchange/serializers.py" = ["E402"]

[tool.isort]
profile = "django"
multi_line_output = 3
line_length = 88
known_first_party = ["seim", "accounts", "analytics", "api", "core", "documents", "exchange", "notifications"]
known_django = ["django"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
force_alphabetical_sort_within_sections = true

# Gradual typing: debt baseline ignores type errors so CI mypy can report cleanly.
# Re-enable checking per-app (remove ignore_errors / restore disallow_*) as modules are annotated.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
ignore_errors = true
warn_unused_configs = true
exclude = [
    "migrations/",
    "tests/",
    "scripts/",
    "documentation/",
    "htmlcov/",
    "frontend-vue/",
    "manage.py",
    "download_uadec_assets.py",
    "scripts/download_institution_assets.py",
]

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "djangorestframework.*",
    "celery.*",
    "redis.*",
    "reportlab.*",
    "magic.*",
    "dynforms.*",
    "ses.*",
    "spectacular.*",
    "filter.*",
    "whitenoise.*",
    "sphinx.*",
    "wagtail.*",
    "SpiffWorkflow.*",
    "channels.*",
    "defusedxml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "seim.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=accounts",
    "--cov=analytics",
    "--cov=api",
    "--cov=application_forms",
    "--cov=core",
    "--cov=data_management",
    "--cov=documents",
    "--cov=exchange",
    "--cov=grades",
    "--cov=internacional",
    "--cov=notifications",
    "--cov=seim",
    "--cov-config=pyproject.toml",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
# First-party Django apps measured by unit+integration runs. CMS is omitted: ``seim.settings.test``
# strips Wagtail/cms, so including ``cms`` would falsely tank the gate (see docs/prompts/ci-backend-green-prompt.md).
source = [
    "accounts",
    "analytics",
    "api",
    "application_forms",
    "core",
    "data_management",
    "documents",
    "exchange",
    "grades",
    "internacional",
    "notifications",
    "seim",
]
omit = [
    "*/migrations/*",
    "*/management/commands/*",
    "*/tests/*",
    "*/tests.py",
    "*/venv/*",
    "*/env/*",
    "*/__pycache__/*",
    "*/staticfiles/*",
    "*/media/*",
    "manage.py",
    "*/settings/*",
    "*/wsgi.py",
    "*/asgi.py",
    "*/celery.py",
    "seim/urls_OLD_BACKUP.py",
    "download_uadec_assets.py",
    "scripts/download_institution_assets.py",
    "scripts/check_python_deps.py",
    # Thin wiring / boilerplate: focus gate on models, services, tasks, etc.
    "*/admin.py",
    "*/views.py",
    "*/serializers.py",
    "*/urls.py",
    "*/filters.py",
    "*/forms.py",
    # ASGI/WebSocket wiring; exercised by dedicated tests, not unit+integration HTTP runs.
    "notifications/jwt_middleware.py",
    "notifications/routing.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    "migrations",
    "staticfiles",
    "media",
    "scripts",
    "openclaw",
    "frontend-vue",
    "node_modules",
    ".venv",
    "htmlcov",
]
skips = ["B101", "B601", "B501"]

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0621",  # redefined-outer-name
    "W0612",  # unused-variable
    "W0611",  # unused-import
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 10
max-attributes = 10
max-bool-expr = 5
max-branches = 15
max-locals = 20
max-parents = 7
max-public-methods = 20
max-returns = 6
max-statements = 60 