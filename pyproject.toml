[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seim"
version = "1.0.0"
description = "Student Exchange Information Management System"
authors = [{name = "Mario Alejandro Manzano and SEIM contributors"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
# Single source of truth for Python pins. Install with:
#   pip install -e ".[dev]"   # or .[test] / .[docs]
dependencies = [
    # Core Django and DRF
    "Django==5.1.15",
    "djangorestframework==3.16.1",
    "django-cors-headers==4.9.0",
    "django-environ==0.12.0",
    # Authentication and Security
    "djangorestframework-simplejwt==5.5.1",
    "defusedxml==0.7.1",
    # Database and Caching
    "psycopg2-binary==2.9.11",
    "redis==5.0.4",
    "django-redis==6.0.0",
    "django-cacheops==7.2",
    # Background Tasks and Queue Management
    "celery==5.5.3",
    "django-celery-results==2.6.0",
    "django-celery-beat==2.8.1",
    # Performance and Monitoring
    "psutil==7.1.3",
    "django-extensions==4.1",
    # File Handling and Media
    "Pillow==12.3.0",
    "django-storages==1.14.6",
    "pylibmagic==0.5.0",
    "reportlab==4.4.5",
    # API Documentation
    "drf-spectacular==0.29.0",
    # Production and Deployment
    "gunicorn==23.0.0",
    "whitenoise==6.6.0",
    "sentry-sdk==2.8.0",
    # Utilities
    "openpyxl==3.1.5",
    "python-dateutil==2.8.2",
    "pytz==2024.1",
    "requests==2.33.0",
    "django-js-reverse==0.10.2",
    "django-filter==24.3",
    # Wagtail CMS
    "wagtail==7.0.8",
    "wagtail-seo==3.1.1",
    "wagtail-markdown==0.14.1",
    # Dynamic Forms and UI Components
    "django-dynforms==2025.9.10",
    "crispy-bootstrap5==2025.6",
    "django-crisp-modals==2025.10.0",
    "django-itemlist==2025.7.7",
    # Additional Utilities
    "Markdown==3.10",
    "numpy==2.2.6",
    "py-dateutil==2.2",
    "pycryptodome==3.23.0",
    "pyparsing==3.2.5",
    # Workflow Engine (BPMN)
    "SpiffWorkflow==3.1.2",
    "lxml==6.1.0",
    # WebSocket Support
    "channels==4.3.1",
    "channels-redis==4.3.0",
    "daphne==4.2.2",
]

[project.optional-dependencies]
dev = [
    # Code formatting and linting
    "ruff==0.12.2",
    "isort==5.13.2",
    "flake8==6.1.0",
    "flake8-docstrings==1.7.0",
    "flake8-import-order==0.18.2",
    "flake8-quotes==3.4.0",
    "flake8-bugbear==24.2.6",
    "flake8-django==1.4",
    # Type checking
    "mypy==1.18.2",
    "django-stubs==5.2.7",
    "types-requests==2.31.0.20240106",
    "types-PyYAML==6.0.12.12",
    # Code complexity and quality
    "radon==6.0.1",
    "mccabe==0.7.0",
    "pylint==2.17.7",
    "pylint-django==2.5.5",
    # Security analysis
    "bandit==1.8.6",
    # Pre-commit hooks
    "pre-commit==4.4.0",
    # Documentation (aligned with [docs])
    "sphinx==7.4.7",
    "sphinx-rtd-theme==2.0.0",
    "sphinx-autodoc-typehints==1.25.3",
    # Development utilities
    "ipython==8.18.1",
    "ipdb==0.13.13",
    "django-debug-toolbar==6.1.0",
    "django-livereload==1.7",
    # Testing and Code Coverage (aligned with [test])
    "pytest==8.3.5",
    "pytest-django==4.7.0",
    "pytest-cov==4.1.0",
    "pytest-html==4.1.1",
    "pytest-json-report==1.5.0",
    "pytest-mock==3.12.0",
    "pytest-xdist==3.5.0",
    "pytest-asyncio==0.25.3",
    "pytest-selenium==4.1.0",
    "factory-boy==3.3.3",
    "faker==37.12.0",
    "freezegun==1.5.5",
    "responses==0.24.1",
    "httpretty==1.1.4",
    "coverage==7.11.3",
    "webdriver-manager==4.0.1",
    # Performance profiling
    "memory-profiler==0.61.0",
    "line-profiler==5.0.0",
]
test = [
    # Core testing (versions match [dev] where packages overlap)
    "pytest==8.3.5",
    "pytest-django==4.7.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "pytest-selenium==4.1.0",
    "pytest-xdist==3.5.0",
    "pytest-asyncio==0.25.3",
    # Test data and mocking
    "factory-boy==3.3.3",
    "faker==37.12.0",
    "freezegun==1.5.5",
    "responses==0.24.1",
    "httpretty==1.1.4",
    "coverage==7.11.3",
    # Selenium (host-oriented tests; kept for parity with dev)
    "webdriver-manager==4.0.1",
    # Playwright E2E
    "playwright==1.41.2",
    "pytest-playwright==0.4.4",
    "pytest-base-url==2.1.0",
    "pytest-html==4.1.1",
    "pixelmatch==0.3.0",
    "axe-playwright-python==0.1.3",
]
docs = [
    "sphinx==7.4.7",
    "sphinx-rtd-theme==2.0.0",
    "sphinx-autodoc-typehints==1.25.3",
]

[project.urls]
Homepage = "https://github.com/mariomanza150/SEIM"
Issues = "https://github.com/mariomanza150/SEIM/issues"
Documentation = "https://github.com/mariomanza150/SEIM/blob/main/docs/README.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["seim*"]

# Ruff configuration - used for linting and formatting (not Black)
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    "migrations",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "B008",  # do not perform function calls in argument defaults (common in Django)
    "C901",  # too complex
    "DJ001", # avoid using null=True on string-based fields (sometimes needed)
    "B904",  # raise without from inside except (noisy legacy)
    "E722",  # bare except (noisy legacy)
    "B017",  # assert Raises(Exception) (noisy in tests/legacy)
    "DJ007", # ModelForm without Meta.fields/exclude
    "DJ008", # Model without __str__
    "DJ012", # order of model methods
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"*/tests/*" = ["B011"]    # assert False
"seim/settings/*.py" = ["F403", "F405", "E402"]
"seim/asgi.py" = ["E402"]
"scripts/**/*.py" = ["E402", "F401", "F405", "F403"]
"tests/**/*.py" = ["E402", "F401", "F811", "B018", "F405", "F403"]
"docs/**/*.py" = ["E402", "F401"]
"core/management/commands/*.py" = ["E402", "F401"]
"core/permissions.py" = ["E402"]
"documents/services.py" = ["E402"]
"exchange/serializers.py" = ["E402"]

[tool.isort]
profile = "django"
multi_line_output = 3
line_length = 88
known_first_party = ["seim", "accounts", "analytics", "api", "core", "documents", "exchange", "notifications"]
known_django = ["django"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
force_alphabetical_sort_within_sections = true

# Gradual typing: debt baseline ignores type errors so CI mypy can report cleanly.
# Re-enable checking per-app (remove ignore_errors / restore disallow_*) as modules are annotated.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
ignore_errors = true
warn_unused_configs = true
exclude = [
    "migrations/",
    "tests/",
    "scripts/",
    "docs/",
    "htmlcov/",
    "frontend-vue/",
    "manage.py",
    "download_uadec_assets.py",
    "scripts/download_institution_assets.py",
]

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "djangorestframework.*",
    "celery.*",
    "redis.*",
    "reportlab.*",
    "magic.*",
    "dynforms.*",
    "ses.*",
    "spectacular.*",
    "filter.*",
    "whitenoise.*",
    "sphinx.*",
    "wagtail.*",
    "SpiffWorkflow.*",
    "channels.*",
    "defusedxml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "seim.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=accounts",
    "--cov=analytics",
    "--cov=api",
    "--cov=application_forms",
    "--cov=core",
    "--cov=data_management",
    "--cov=documents",
    "--cov=exchange",
    "--cov=grades",
    "--cov=internacional",
    "--cov=notifications",
    "--cov=seim",
    "--cov-config=pyproject.toml",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
# First-party Django apps measured by unit+integration runs. CMS is omitted: ``seim.settings.test``
# strips Wagtail/cms, so including ``cms`` would falsely tank the gate (see docs/notes/prompts/ci-backend-green-prompt.md).
source = [
    "accounts",
    "analytics",
    "api",
    "application_forms",
    "core",
    "data_management",
    "documents",
    "exchange",
    "grades",
    "internacional",
    "notifications",
    "seim",
]
omit = [
    "*/migrations/*",
    "*/management/commands/*",
    "*/tests/*",
    "*/tests.py",
    "*/venv/*",
    "*/env/*",
    "*/__pycache__/*",
    "*/staticfiles/*",
    "*/media/*",
    "manage.py",
    "*/settings/*",
    "*/wsgi.py",
    "*/asgi.py",
    "*/celery.py",
    "seim/urls_OLD_BACKUP.py",
    "download_uadec_assets.py",
    "scripts/download_institution_assets.py",
    "scripts/check_python_deps.py",
    "scripts/check_codecov_ci.py",
    # Thin wiring / boilerplate: focus gate on models, services, tasks, etc.
    "*/admin.py",
    "*/views.py",
    "*/serializers.py",
    "*/urls.py",
    "*/filters.py",
    "*/forms.py",
    # ASGI/WebSocket wiring; exercised by dedicated tests, not unit+integration HTTP runs.
    "notifications/jwt_middleware.py",
    "notifications/routing.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    "migrations",
    "staticfiles",
    "media",
    "scripts",
    "openclaw",
    "frontend-vue",
    "node_modules",
    ".venv",
    "htmlcov",
]
skips = ["B101", "B601", "B501"]

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0621",  # redefined-outer-name
    "W0612",  # unused-variable
    "W0611",  # unused-import
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 10
max-attributes = 10
max-bool-expr = 5
max-branches = 15
max-locals = 20
max-parents = 7
max-public-methods = 20
max-returns = 6
max-statements = 60 