# Coverage tracker. Local/dev is unaffected: pytest --cov-fail-under=80
# (pytest.ini / pyproject.toml) remains the hard unit+integration gate.
# CI uploads with the GitHub secret CODECOV_TOKEN (never commit a token).
# Backend project/patch statuses fail the Codecov GitHub check when coverage
# drops past the threshold. Frontend stays informational (Vue coverage in flux).

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 2%
      backend:
        flags:
          - backend
        target: auto
        threshold: 2%
      frontend:
        flags:
          - frontend
        informational: true
        target: auto
        threshold: 3%
    patch:
      default:
        target: 50%
        threshold: 5%
      backend:
        flags:
          - backend
        target: 50%
        threshold: 5%
      frontend:
        flags:
          - frontend
        informational: true
        target: 40%
        threshold: 5%

comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

github_checks:
  annotations: true

flags:
  backend:
    paths:
      - accounts/
      - analytics/
      - api/
      - application_forms/
      - core/
      - data_management/
      - documents/
      - exchange/
      - grades/
      - internacional/
      - notifications/
      - seim/
    carryforward: true
  frontend:
    paths:
      - frontend-vue/src/
    carryforward: true

ignore:
  - "*/migrations/*"
  - "*/management/commands/*"
  - "*/tests/*"
  - "*/tests.py"
  - "frontend-vue/src/**/*.spec.js"
  - "frontend-vue/src/**/*.test.js"
  - "frontend-vue/dist/**"
