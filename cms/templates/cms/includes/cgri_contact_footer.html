{% if cgri %}
<section class="py-5 bg-light" id="contacto-cgri">
    <div class="container">
        <div class="row g-4 align-items-stretch">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <p class="text-uppercase small text-muted mb-1">Coordinadora General</p>
                        <h3 class="h5 fw-bold mb-2">{{ cgri.contact.coordinator_name }}</h3>
                        <p class="small mb-0">
                            <a href="mailto:{{ cgri.contact.coordinator_email }}">{{ cgri.contact.coordinator_email }}</a>
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <ul class="list-unstyled mb-0">
                            <li class="mb-2">
                                <i class="bi bi-telephone me-2" style="color: var(--uadec-gold);" aria-hidden="true"></i>
                                {{ cgri.contact.phone }}
                            </li>
                            <li class="mb-2">
                                <i class="bi bi-envelope me-2" style="color: var(--uadec-gold);" aria-hidden="true"></i>
                                <a href="mailto:{{ cgri.contact.office_email }}">{{ cgri.contact.office_email }}</a>
                            </li>
                            <li class="mb-0">
                                <i class="bi bi-geo-alt me-2" style="color: var(--uadec-gold);" aria-hidden="true"></i>
                                {{ cgri.contact.office }}
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="ratio ratio-4x3 rounded overflow-hidden shadow-sm">
                    <iframe
                        src="{{ cgri.map_embed }}"
                        title="Ubicación de la Coordinación de Relaciones Internacionales"
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                    ></iframe>
                </div>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-3 justify-content-center mt-4">
            <a href="{{ cgri.organigrama_pdf }}" class="btn btn-outline-primary" target="_blank" rel="noopener">
                <i class="bi bi-diagram-3 me-2" aria-hidden="true"></i>Organigrama
            </a>
            <a href="{{ cgri.directorio_url }}" class="btn btn-outline-primary" target="_blank" rel="noopener">
                <i class="bi bi-person-vcard me-2" aria-hidden="true"></i>Directorio
            </a>
        </div>
    </div>
</section>
{% endif %}
