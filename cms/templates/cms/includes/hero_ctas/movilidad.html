{% if user.is_authenticated %}
<a href="/seim/dashboard/" class="btn btn-secondary btn-lg px-5 py-3 shadow">
    <i class="bi bi-speedometer2 me-2"></i>Mi Panel
</a>
{% else %}
<div class="d-flex gap-3 flex-wrap">
    <a href="/seim/register/" class="btn btn-secondary btn-lg px-5 py-3 shadow">
        <i class="bi bi-person-plus me-2"></i>Crear Cuenta
    </a>
    <a href="/seim/login/" class="btn btn-outline-light btn-lg px-4 py-3 shadow">
        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
    </a>
</div>
{% endif %}
