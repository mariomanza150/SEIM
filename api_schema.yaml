    NotificationSettings:
      type: object
      description: Serializer for notification settings only.
      properties:
        email_applications:
          type: boolean
          description: Email notifications for application updates
        email_documents:
          type: boolean
          description: Email notifications for document uploads
        email_comments:
          type: boolean
          description: Email notifications for comments (application/document threads)
        email_programs:
          type: boolean
          description: Email notifications for new programs
        email_system:
          type: boolean
          description: Email notifications for system messages
        inapp_applications:
          type: boolean
          description: In-app notifications for application updates
        inapp_documents:
          type: boolean
          description: In-app notifications for document uploads
        inapp_comments:
          type: boolean
          description: In-app notifications for comments
        inapp_programs:
          type: boolean
          description: In-app notifications for new programs and program announcements
        inapp_system:
          type: boolean
          description: In-app notifications for system messages (e.g. agreement reminders)
        notification_digest_frequency:
          allOf:
          - $ref: '#/components/schemas/NotificationDigestFrequencyEnum'
          description: |-
            Summarize unread in-app notifications on a schedule.

            * `off` - Off
            * `daily` - Daily
            * `weekly` - Weekly
        email_notification_digest:
          type: boolean
          description: Also email the digest when system email is enabled.
