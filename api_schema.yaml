  /api/notification-routing-overrides/:
    get:
      operationId: notification_routing_overrides_list
      description: 'Staff-only. Paginated list of admin-configurable routing overrides
        (reminder event types and transactional route keys). Affects live reminder
        dispatch and the routing-reference API. **Filters:** ``kind``, ``key``, ``settings_category``,
        ``is_active``. **Search:** ``key``. **Ordering:** ``updated_at``, ``created_at``,
        ``kind``, ``key`` (default: ``kind``, ``key``).'
      summary: List notification routing overrides
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: key
        schema:
          type: string
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - reminder_event_type
          - transactional_route_key
        description: |-
          * `reminder_event_type` - Reminder event type
          * `transactional_route_key` - Transactional route key
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: settings_category
        schema:
          type: string
          enum:
          - applications
          - comments
          - documents
          - programs
          - system
          - ungated
        description: |-
          Which UserSettings notification group gates delivery for this key. Use Ungated to bypass group toggles (settings_category=None).

          * `applications` - Applications
          * `documents` - Documents
          * `comments` - Comments
          * `programs` - Programs
          * `system` - System
          * `ungated` - Ungated (ignore UserSettings groups)
      tags:
      - notifications
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationRoutingOverrideList'
          description: ''
    post:
      operationId: notification_routing_overrides_create
      description: Create an override. **Unique** on (``kind``, ``key``). ``settings_category``
        may be ``ungated`` so matching reminders bypass user preference gating.
      summary: Create notification routing override
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRoutingOverrideRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationRoutingOverrideRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationRoutingOverrideRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRoutingOverride'
          description: ''
        '400':
          description: Validation error.
        '403':
          description: Forbidden without coordinator or admin role.
