    WorkflowDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        is_active:
          type: boolean
        latest_published_version:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - latest_published_version
      - name
      - slug
      - updated_at
    WorkflowDefinitionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        is_active:
          type: boolean
      required:
      - name
    WorkflowVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        definition:
          type: string
          format: uuid
        definition_slug:
          type: string
          readOnly: true
        definition_name:
          type: string
          readOnly: true
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/WorkflowVersionStatusEnum'
        bpmn_xml:
          type: string
          description: BPMN 2.0 XML source for this version.
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bpmn_xml
      - created_at
      - created_by
      - definition
      - definition_name
      - definition_slug
      - id
      - published_at
      - updated_at
      - version
    WorkflowVersionRequest:
      type: object
      properties:
        definition:
          type: string
          format: uuid
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          $ref: '#/components/schemas/WorkflowVersionStatusEnum'
        bpmn_xml:
          type: string
          minLength: 1
          description: BPMN 2.0 XML source for this version.
      required:
      - bpmn_xml
      - definition
      - version
    WorkflowVersionStatusEnum:
      enum:
      - draft
      - published
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `archived` - Archived
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
