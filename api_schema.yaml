openapi: 3.0.3
info:
  title: SEIM API
  version: 1.0.0
  description: "\n    Student Exchange Information Manager (SEIM) API\n\n    A comprehensive
    API for managing student exchange programs, applications, documents, and notifications.\n\n
    \   ## Features\n    - **User Management**: Registration, authentication, and
    role-based access control\n    - **Program Management**: Create and manage exchange
    programs with eligibility criteria\n    - **Application Workflow**: Complete application
    lifecycle from draft to completion\n    - **Document Management**: File upload,
    validation, and resubmission workflows\n    - **Notifications**: Email and in-app
    notification system\n    - **Analytics**: Reporting and dashboard metrics\n\n
    \   ## Authentication\n    This API uses JWT (JSON Web Token) authentication.
    Include the token in the Authorization header:\n    ```\n    Authorization: Bearer
    <your_token>\n    ```\n\n    ## Roles\n    - **Student**: Can create applications,
    upload documents, view their own data\n    - **Coordinator**: Can review applications,
    validate documents, manage programs\n    - **Admin**: Full system access, user
    management, analytics\n    "
  contact:
    name: SEIM Development Team
    email: support@seim.local
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
