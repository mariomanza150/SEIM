  /api/programs/{id}/check_eligibility/:
    get:
      operationId: programs_check_eligibility_retrieve
      description: 'Evaluates code-defined rules for the **authenticated user** (profile,
        window, etc.). Optional query ``application`` (UUID): must be owned by the
        caller and belong to this program; when set, **required_documents** and **dynamic_form**
        rules run when configured. Optional ``use_ruleset=true`` when the program
        has a linked **EligibilityRuleSet**: applies ``rules_json.program_overrides``
        on top of program fields for this check only. Successful rule outcome uses
        HTTP 200 with ``eligible: true|false``; ``schema_version`` increments when
        rule set or shape changes.'
      summary: Check eligibility for this program
      parameters:
      - in: query
        name: application
        schema:
          type: string
          format: uuid
        description: Application id for per-application rules (documents, dynamic
          form). Must match this program and the current user.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this program.
        required: true
      - in: query
        name: use_ruleset
        schema:
          type: boolean
        description: When true and the program has an active linked eligibility ruleset,
          evaluate using ruleset scalar overrides (``rules_json.program_overrides``).
      tags:
      - programs
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramCheckEligibilityResponse'
          description: ''
        '400':
          description: Invalid `application` id or application not for this program
            (`detail`).
        '403':
          description: '`application` belongs to another user (`detail`).'
        '404':
          description: '`application` not found (`detail`).'
  /api/programs/{id}/clone/:
    post:
      operationId: programs_clone_create
      description: |-
        Clone an existing program to speed up creation of similar programs.

        Creates a copy of the program with:
        - Same configuration (min_gpa, required_language, recurring)
        - Same application form
        - New name (appended with " (Copy)")
        - New dates (to be set by admin)
        - Marked as inactive by default

        Admins can then modify the cloned program before activating it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this program.
        required: true
      tags:
      - programs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
        required: true
