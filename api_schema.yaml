components:
  schemas:
    AcademicLevel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        code:
          type: string
          maxLength: 50
        ordering:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
      required:
      - id
      - name
    AcademicLevelRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        code:
          type: string
          maxLength: 50
        ordering:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
      required:
      - name
    Activity:
      type: object
      description: Serializer for activity timeline entry.
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        description:
          type: string
        user:
          type: string
          nullable: true
        timestamp:
          type: string
        related_object:
          type: object
          additionalProperties: {}
      required:
      - description
      - id
      - related_object
      - timestamp
      - title
      - type
      - user
    AgreementTypeEnum:
      enum:
      - bilateral
      - multilateral
      - erasmus
      - specific
      - other
      type: string
      description: |-
        * `bilateral` - Bilateral
        * `multilateral` - Multilateral
        * `erasmus` - Erasmus+
        * `specific` - Specific program
        * `other` - Other
    Alert:
      type: object
      description: Serializer for system alert.
      properties:
        level:
          type: string
        title:
          type: string
        message:
          type: string
        timestamp:
          type: string
      required:
      - level
      - message
