exclude: ^(node_modules|frontend-vue/node_modules|frontend-vue/dist|staticfiles|media|htmlcov|coverage|openclaw|seim-localprod-export)/|\.min\.(js|css)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -ll]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests|scripts|docs)/|/migrations/

  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend-vue)
        language: node
        additional_dependencies: ["prettier@3.3.3"]
        entry: prettier --write --ignore-unknown
        files: ^frontend-vue/src/.*\.(js|ts|vue|css|scss|json)$
